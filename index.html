<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #f4f7fb; font-family: system-ui, sans-serif; }

<body>
  <main>
    <h1>Hello, world!</h1>
    <p>Welcome to my website.</p>

</html>
